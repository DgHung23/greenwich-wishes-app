# docker compose up -d --build
# Đọc cấu hình từ file ".env" (sao chép từ .env.example)

services:
  postgres:
    image: postgres:16-alpine
    container_name: greenwich_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenwich_wishes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-greenwich_wishes}"]
      interval: 5s
      timeout: 5s
      retries: 5

  wishes:
    build: .
    container_name: greenwich_wishes_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-greenwich_wishes}
      DATA_DIR: /data
      TRUST_PROXY: "1"
      PUBLIC_URL: ${PUBLIC_URL:-https://d1qji552j01z75.cloudfront.net}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    ports:
      - '${HOST_PORT:-80}:8780'

volumes:
  postgres_data:
