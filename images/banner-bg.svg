<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1919 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061b3d"/>
      <stop offset=".55" stop-color="#0a2a5e"/>
      <stop offset="1" stop-color="#173f85"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="48%" r="45%">
      <stop offset="0" stop-color="#f37021" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f37021" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#2d63b8"/>
      <stop offset=".7" stop-color="#0f3170"/>
      <stop offset="1" stop-color="#081d45"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1919" height="800" fill="url(#bg)"/>
  <rect width="1919" height="800" fill="url(#dots)"/>
  <rect width="1919" height="800" fill="url(#glow)"/>

  <!-- Globe -->
  <g transform="translate(1400 400)">
    <circle r="300" fill="url(#globe)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5">
      <ellipse rx="300" ry="100"/><ellipse rx="300" ry="200"/>
      <ellipse rx="100" ry="300"/><ellipse rx="200" ry="300"/>
      <line x1="-300" y1="0" x2="300" y2="0"/><line x1="0" y1="-300" x2="0" y2="300"/>
    </g>
    <circle r="300" fill="none" stroke="#f37021" stroke-opacity=".6" stroke-width="2"/>
    <circle r="340" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1" stroke-dasharray="4 10"/>
    <circle r="390" fill="none" stroke="#f37021" stroke-opacity=".2" stroke-width="1"/>
    <!-- connection arcs to Vietnam -->
    <g fill="none" stroke="#f37021" stroke-width="3" stroke-linecap="round">
      <path d="M95 30 Q -60 -260 -210 -120" opacity=".9"/>
      <path d="M95 30 Q 20 -320 -40 -230" opacity=".7"/>
      <path d="M95 30 Q 260 -120 210 -170" opacity=".8"/>
      <path d="M95 30 Q 230 210 170 220" opacity=".7"/>
      <path d="M95 30 Q -150 170 -230 90" opacity=".6"/>
    </g>
    <g fill="#fff">
      <circle cx="95" cy="30" r="10" fill="#f37021"/><circle cx="95" cy="30" r="22" fill="none" stroke="#f37021" stroke-width="2" opacity=".6"/>
      <circle cx="-210" cy="-120" r="6"/><circle cx="-40" cy="-230" r="6"/><circle cx="210" cy="-170" r="6"/>
      <circle cx="170" cy="220" r="6"/><circle cx="-230" cy="90" r="6"/>
    </g>
  </g>

  <!-- floating wish envelopes / sparkles -->
  <g fill="#fff" opacity=".85">
    <path d="M1030 150 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M1820 120 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z"/>
    <path d="M1790 690 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#f37021"/>
    <path d="M1060 640 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#f37021"/>
  </g>
  <g transform="translate(1080 260) rotate(-12)">
    <rect width="96" height="64" rx="8" fill="#fff"/>
    <path d="M4 6 L48 38 L92 6" fill="none" stroke="#f37021" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1735 520) rotate(14)">
    <rect width="76" height="50" rx="7" fill="#f37021"/>
    <path d="M4 5 L38 30 L72 5" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- bottom wave -->
  <path d="M0 720 C 400 660 800 780 1200 720 S 1700 680 1919 730 L1919 800 L0 800z" fill="#f37021" opacity=".18"/>
  <path d="M0 760 C 500 720 900 800 1300 760 S 1750 740 1919 770 L1919 800 L0 800z" fill="#f37021" opacity=".3"/>
</svg>
