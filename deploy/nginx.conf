# nginx alternative. Save as /etc/nginx/sites-available/greenwich-wishes, symlink into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wishes.example.edu.vn        (adds HTTPS and auto-renewal)
server {
    listen 80;
    server_name wishes.example.edu.vn;

    client_max_body_size 8m;          # photo + share card upload

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;                         # required: the server checks the Origin of POST requests
        proxy_set_header X-Forwarded-Proto $scheme;          # required: enables Secure cookies behind https
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
}
